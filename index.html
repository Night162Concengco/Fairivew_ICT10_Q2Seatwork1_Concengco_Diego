<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <title>SW 1</title>

    <style>
        body {
            background-color: #f0f4f8;
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .title {
            text-align: center;
            font-size: 40px;
            color: #050044;
            margin-bottom: 10px;
        }

        .welcome {
            text-align: center;
            font-size: 15px;
            color: #555;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        button {
            padding: 12px 20px;
            background-color: #1e90ff;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #187bcd;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="title">Candidate Verification System</div>
        <div class="welcome">ICT Club</div>

        <div class="form-group">
            <label for="fname">First Name:</label>
            <input type="text" id="fname" name="fname">
        </div>

        <div class="form-group">
            <label for="lname">Second Name:</label>
            <input type="text" id="lname" name="lname">
        </div>

        <div class="form-group">
            <button type="button" id="btn-submit">Submit Verification</button>
        </div>

        <p id="result"></p>
    </div>

    <script type="py" src="main.py" config='{"packages": []}'></script>
</body>
</html>
